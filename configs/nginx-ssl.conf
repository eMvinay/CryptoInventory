# TEST FILE - nginx TLS config (mixed good/weak)
server {
    listen 443 ssl;
    server_name app.ci.test;
    ssl_certificate     /etc/ssl/ci/fullchain.pem;
    ssl_certificate_key /etc/ssl/ci/server-rsa2048.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;                  # WEAK: TLS1.0/1.1
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:AES128-SHA:DES-CBC3-SHA:RC4-SHA';
    ssl_dhparam /etc/ssl/ci/dh1024-WEAK.pem;                       # WEAK
    ssl_stapling on;
}
